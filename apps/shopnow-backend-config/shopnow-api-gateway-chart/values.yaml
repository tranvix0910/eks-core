# Global settings
global:
  appName: "shopnow-api-gateway"
  namespace: "shopnow"
  enabledComponents:
    configmap: true
    service: true
    ingress: true

image:
  repository: ""
  tag: "v1"
  pullPolicy: Always

replicaCount: 1
revisionHistoryLimit: 10
rollingUpdate:
  maxSurge: 25%
  maxUnavailable: 25%

# Scheduling. Sends pods to node pool 2 (ms-od / ms-spot), same as every other
# shopnow backend service - see gitops/platform/nodepools.
nodeSelector:
  workload: microservices
tolerations:
  - key: workload
    operator: Equal
    value: microservices
    effect: NoSchedule

terminationGracePeriodSeconds: 60

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

persistence:
  enabled: false
  storageClass: efs-sc
  size: 5Gi
  mountPath: /data

service:
  type: ClusterIP
  port: 5860
  targetPort: 5860

# Joins the shared eks-workload ALB on its own listener port, same pattern as
# every other shopnow service - see shopnow-cart-service-chart/templates/ingress.yaml.
# 5860 matches server.port so `docker run -p 5860:5860` and the in-cluster
# port stay the same number - one less thing to remember.
ingress:
  className: "alb"
  host: ""
  path: "/"
  pathType: Prefix
  groupName: "eks-workload"
  groupOrder: 65
  listenPorts: '[{"HTTP": 5860}]'
  inboundCidrs: "0.0.0.0/0"
  # Unlike the other backend services, this one actually has actuator
  # (spring-boot-starter-actuator is a real dependency here) - so this can
  # point at the real health endpoint instead of the "/" + 200-404 workaround.
  healthcheckPath: "/actuator/health"
  successCodes: "200"

configmap:
  data: {}

serviceAccount:
  create: false

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
