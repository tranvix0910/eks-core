apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopnow-product-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  destination:
    namespace: shopnow
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/tranvix0910/eks-core.git
    targetRevision: main
    path: apps/shopnow-backend-config/shopnow-product-service-chart
    helm:
      valueFiles:
        - values.yaml
        - ../shopnow-product-service-config/overlays/production/values.yaml
      values: |
        image:
          repository: "963626856932.dkr.ecr.ap-northeast-1.amazonaws.com/shopnow/shopnow-product-service"
  project: shopnow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The namespace also ships in shopnow-database-config. This makes the two
      # Applications independent of sync order.
      - CreateNamespace=true
