spring.application.name=api-gateway
server.port=5860
eureka.instance.hostname=api-gateway
eureka.instance.instance-id=${spring.application.name}
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=*
# Exposes /actuator/health/liveness and /actuator/health/readiness as separate
# groups instead of one aggregate /actuator/health - lets the Deployment probe
# "is this instance stuck" and "is it ready for traffic" independently. See
# shopnow-api-gateway-chart/templates/deployment.yaml.
management.endpoint.health.probes.enabled=true
spring.main.web-application-type=reactive


spring.cloud.gateway.discovery.locator.enabled=true

# Predicates have no /api prefix - the frontend (ProductService.js,
# CartService.js, AuthService.js, ProfileService.js) calls bare `product`,
# `shopping-cart`, `user/...` with no prefix, and a predicate matches the
# INCOMING request. But every backend controller is @RequestMapping("api/...")
# (see e.g. ProductController.java), so PrefixPath=/api adds it back on the
# way OUT to the downstream service. Confirmed via live 404 without this
# filter: gateway resolved and connected to product-service fine, but
# product-service itself 404'd on GET /product because it only maps /api/product.
spring.cloud.gateway.routes[0].id=PRODUCT-SERVICE
spring.cloud.gateway.routes[0].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/product/**
spring.cloud.gateway.routes[0].filters[0]=PrefixPath=/api

# lb:// target must match the Eureka registration name, which is
# spring.application.name uppercased - the cart service registers as
# spring.application.name=cart-service, i.e. CART-SERVICE, not
# SHOPPING-CART-SERVICE (confirmed via GET /eureka/apps on the live registry).
spring.cloud.gateway.routes[1].id=CART-SERVICE
spring.cloud.gateway.routes[1].uri=lb://CART-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/shopping-cart/**
spring.cloud.gateway.routes[1].filters[0]=PrefixPath=/api

spring.cloud.gateway.routes[2].id=USER-SERVICE
spring.cloud.gateway.routes[2].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/user/**
spring.cloud.gateway.routes[2].filters[0]=PrefixPath=/api


spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/java-microservice-realm

