apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopnow-frontend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  destination:
    namespace: shopnow
    server: https://kubernetes.default.svc
  source:
    path: apps/shopnow-frontend-config/shopnow-frontend-chart
    repoURL: https://github.com/tranvix0910/eks-core.git
    targetRevision: main
    helm:
      valueFiles:
        - values.yaml
        - ../shopnow-frontend-config/overlays/production/values.yaml
      values: |
        image:
          repository: "963626856932.dkr.ecr.ap-northeast-1.amazonaws.com/shopnow/shopnow-frontend"
  project: shopnow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true