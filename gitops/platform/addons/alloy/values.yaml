# Grafana Alloy for cluster eks-workload (cluster 1). Tails every pod's logs
# on each node and pushes them to Loki on cluster 2 (eks-observability).
#
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm upgrade --install alloy grafana/alloy --version 1.11.1 \
#     --namespace monitoring \
#     --values gitops/platform/addons/alloy/values.yaml --wait
#
# The alloy.configMap.content block below is written in Alloy's own
# configuration language (River), not YAML - this is the one part of a Helm
# values file in this project that is not YAML all the way down. The
# discovery.kubernetes -> discovery.relabel -> loki.source.kubernetes ->
# loki.process -> loki.write pipeline below is Grafana's own documented
# pattern for "collect Kubernetes pod logs", copied from
# https://grafana.com/docs/alloy/latest/collect/logs-in-kubernetes/ and
# adapted only for the cluster label and the write endpoint - not composed
# from memory, since River is not something to get subtly wrong on a
# DaemonSet running on every node.

controller:
  type: daemonset
  # Same taint/label boundary as every other node-scoped tool in this
  # cluster - see docs/runbooks/cluster-1/00-tong-quan.md, principle 2. The
  # infra managed node group carries no taint by design (see
  # 08-su-co-da-xu-ly.md, the helm-operation Pending incident), so this
  # tolerates the one taint that could plausibly still be present without
  # needing one for microservices/karpenter pools - Alloy only needs to run
  # once per node, not once per workload type, and the infra nodes are where
  # everything else node-scoped already lives (node-exporter, kube-proxy).
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
      effect: NoSchedule

  # Volume for the CA cert - paired with alloy.mounts.extra below, which
  # mounts it into the container. Kept in THIS controller: block, not a
  # second top-level `controller:` key - a duplicate top-level key in one
  # YAML file silently overwrites rather than merges, which would have
  # dropped the tolerations above and put every Alloy pod back into Pending
  # (the exact failure class the comment on the Mimir chart's `ingester:`
  # block already warned about for a different chart).
  volumes:
    extra:
      # Same Secret name as gitops/platform/addons/prometheus/values.yaml's
      # prometheusSpec.secrets entry - both are manual copies of
      # cert-manager's observability-alb-tls (namespace cert-manager) into
      # namespace monitoring, since cert-manager only writes the Secret into
      # the namespace its Certificate resource lives in, not every namespace
      # that needs to trust the CA. Same staleness caveat: this does not
      # auto-update on cert-manager renewal.
      - name: observability-ca
        secret:
          secretName: observability-alb-tls

alloy:
  mounts:
    # Mounts /var/log/pods from the host - loki.source.kubernetes reads log
    # files directly rather than going through the container runtime API.
    varlog: true
    # Second mount: the CA cert this DaemonSet needs to trust
    # loki.observability.internal's TLS cert (see the tls_config block in the
    # River config below). alloy.mounts.extra is a plain VolumeMount list on
    # the alloy container; the matching Volume goes under
    # controller.volumes.extra below - the chart keeps these two lists
    # separate rather than one combined "mount" list (checked against the
    # chart's actual templates, containers/_agent.yaml and
    # controllers/_pod.yaml, not assumed).
    extra:
      - name: observability-ca
        mountPath: /etc/alloy/ca
        readOnly: true

  configMap:
    create: true
    content: |
      discovery.kubernetes "pod" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
        }
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pod.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          action        = "replace"
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          action        = "replace"
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          action        = "replace"
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          action        = "replace"
          target_label  = "app"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          action         = "replace"
          target_label   = "job"
          separator      = "/"
          replacement    = "$1"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          action         = "replace"
          target_label   = "__path__"
          separator      = "/"
          replacement    = "/var/log/pods/*$1/*.log"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_id"]
          action        = "replace"
          target_label  = "container_runtime"
          regex         = `^(\S+):\/\/.+$`
          replacement   = "$1"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pod_logs.receiver]
      }

      loki.process "pod_logs" {
        stage.static_labels {
          values = {
            cluster = "eks-workload",
          }
        }

        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "https://loki.observability.internal:3100/loki/api/v1/push"
          tls_config {
            ca_file = "/etc/alloy/ca/ca.crt"
          }
        }
      }

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi