# Consolidated ShopNow ArgoCD Applications Manifest
# Deploys Database Services, Spring Cloud Backends, and Frontend Blue-Green Rollout

---
# 1. Database Layer (Postgres, MySQL, Keycloak) - Wave 0
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopnow-database-services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: shopnow
  source:
    repoURL: https://github.com/tranvix0910/eks-core.git
    targetRevision: main
    path: apps/shopnow-backend-config/shopnow-database-config
  destination:
    server: https://kubernetes.default.svc
    namespace: shopnow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10

---
# 2. Discovery Server (Netflix Eureka) - Wave 1
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopnow-discovery-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: shopnow
  source:
    repoURL: https://github.com/tranvix0910/eks-core.git
    targetRevision: main
    path: apps/shopnow-backend-config/shopnow-discovery-server-chart
    helm:
      valueFiles:
        - values.yaml
        - ../shopnow-discovery-server-config/overlays/production/values.yaml
      values: |
        image:
          repository: "963626856932.dkr.ecr.ap-northeast-1.amazonaws.com/shopnow/shopnow-discovery-server"
  destination:
    namespace: shopnow
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

