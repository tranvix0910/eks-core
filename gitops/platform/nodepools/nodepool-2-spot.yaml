# Node pool 2, spot half. Paired with nodepool-2-ondemand.yaml.
# Lower weight, so this only takes traffic once ms-od hits its cpu limit.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ms-spot
spec:
  weight: 10

  template:
    metadata:
      labels:
        workload: microservices
        capacity: spot
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      # Same taint and label as ms-od, so one pod spec targets both pools.
      taints:
        - key: workload
          value: microservices
          effect: NoSchedule

      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["m", "c", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
        - key: karpenter.k8s.aws/instance-size
          operator: NotIn
          values: ["nano", "micro", "small"]

      expireAfter: 720h

  limits:
    cpu: 72

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    budgets:
      - nodes: "10%"