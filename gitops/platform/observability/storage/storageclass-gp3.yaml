# Default StorageClass for the cluster.
#
# The gp2 class EKS creates automatically still points at the in-tree
# kubernetes.io/aws-ebs provisioner, which Kubernetes removed in 1.27. Any PVC
# using it sits Pending forever. This one uses the CSI driver instead.
#
# gp3 over gp2: cheaper per GB, and IOPS and throughput are configurable
# independently of volume size rather than scaling with it.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com

# Wait for a pod to be scheduled before creating the volume. An EBS volume is
# tied to one Availability Zone, so creating it early risks placing it in an AZ
# where the pod cannot run.
volumeBindingMode: WaitForFirstConsumer

# Delete the volume when its PVC goes away. Correct for a lab; consider Retain
# for anything holding data you would miss.
reclaimPolicy: Delete

allowVolumeExpansion: true

parameters:
  type: gp3
  encrypted: "true"
  # gp3 baseline, included in the price: 3000 IOPS and 125 MiB/s.
  iops: "3000"
  throughput: "125"
