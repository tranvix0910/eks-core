# gitops/platform/observability/tls/ca-issuer.yaml

---

# Root issuer "bootstrap" - used once to self-sign the CA cert
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-root
spec:
  selfSigned: {}

---

# Root CA Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: observability-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: observability-internal-ca
  secretName: observability-ca-secret
  duration: 87600h    # 10 years - Root CA
  issuerRef:
    name: selfsigned-root
    kind: ClusterIssuer

---

# Intermediate Issuer used to sign Mimir / Loki TLS certificates
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: observability-ca-issuer
spec:
  ca:
    secretName: observability-ca-secret